name: local-knowledge-base

# 所有服务的数据均持久化到项目内 ./data 目录，不写入系统路径。
# 对外仅暴露 Nginx 网关端口（GATEWAY_PORT，默认 8080）。

services:
  postgres:
    image: postgres:16-alpine
    container_name: kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - kb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: kb-qdrant
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - kb-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: kb-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    networks:
      - kb-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  embedding:
    build: ./services/model-server
    image: kb-model-server:local
    container_name: kb-embedding
    restart: unless-stopped
    environment:
      MODEL_TYPE: embedding
      MODEL_PATH: /models/bge-m3
      PORT: "8001"
    volumes:
      - ./models/embedding/bge-m3:/models/bge-m3:ro
    networks:
      - kb-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${EMBED_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  reranker:
    image: kb-model-server:local
    container_name: kb-reranker
    restart: unless-stopped
    depends_on:
      embedding:
        condition: service_started
    environment:
      MODEL_TYPE: reranker
      MODEL_PATH: /models/bge-reranker-v2-m3
      PORT: "8002"
    volumes:
      - ./models/reranker/bge-reranker-v2-m3:/models/bge-reranker-v2-m3:ro
    networks:
      - kb-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${EMBED_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8002/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: kb-llm
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: "${LLM_GPU:-1}"
    volumes:
      - ./models/llm:/models/llm:ro
    command: >
      -m /models/llm/Qwen3-8B-Q4_K_M.gguf
      --alias ${LLM_MODEL}
      --host 0.0.0.0 --port 8080
      -ngl 99 -c 8192 -b 2048
      --reasoning-budget 0
      --api-key ${LLM_API_KEY}
    networks:
      - kb-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLM_GPU:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  backend:
    build: ./backend
    image: kb-backend:local
    container_name: kb-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./data/documents:/app/data/documents
      - ./data/extracted:/app/data/extracted
      - ./data/temporary:/app/data/temporary
      - ./data/logs:/app/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kb-network

  worker:
    image: kb-backend:local
    container_name: kb-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - ./data/documents:/app/data/documents
      - ./data/extracted:/app/data/extracted
      - ./data/temporary:/app/data/temporary
      - ./data/logs:/app/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kb-network

  nginx:
    build: ./frontend
    image: kb-frontend:local
    container_name: kb-nginx
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./configs/nginx/kb-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/logs/nginx:/var/log/nginx
    depends_on:
      - backend
    networks:
      - kb-network

networks:
  kb-network:
    driver: bridge
